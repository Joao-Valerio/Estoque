<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2825" />
      <stop offset="100%" stop-color="#181614" />
    </linearGradient>

    <!-- Top Face Gradient (Highlight) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Left Face Gradient (Midtone) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Right Face Gradient (Shadow) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Box Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D depth -->
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8" />

  <!-- 3D Isometric Box Group -->
  <g filter="url(#cubeShadow)">
    <!-- Top Face -->
    <polygon points="256,120 380,188 256,256 132,188" fill="url(#topFace)" />
    
    <!-- Left Face -->
    <polygon points="132,188 256,256 256,380 132,312" fill="url(#leftFace)" />
    
    <!-- Right Face -->
    <polygon points="256,256 380,188 380,312 256,380" fill="url(#rightFace)" />

    <!-- Packaging Tape Detail across top & front -->
    <!-- Top Tape -->
    <polygon points="236,131 276,153 276,245 236,223" fill="url(#tapeGrad)" opacity="0.9" />
    <!-- Front Tape Left -->
    <polygon points="236,223 256,234 256,380 236,369" fill="#fed7aa" opacity="0.85" />
    <!-- Front Tape Right -->
    <polygon points="256,234 276,223 276,369 256,380" fill="#ea580c" opacity="0.4" />

    <!-- Inner subtle highlights on edges -->
    <polyline points="132,188 256,256 380,188" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />
    <line x1="256" y1="256" x2="256" y2="380" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
  </g>
</svg>
