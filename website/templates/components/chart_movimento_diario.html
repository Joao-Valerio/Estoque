{{ chart_movimento_diario|json_script:"chart-movimento-diario-data" }}
<script>
(function () {
    const mov = JSON.parse(document.getElementById('chart-movimento-diario-data').textContent);
    const canvas = document.getElementById('{{ canvas_id }}');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: mov.labels,
            datasets: [
                {
                    label: 'Entrada',
                    data: mov.entrada,
                    borderColor: '#22c55e',
                    backgroundColor: 'rgba(34, 197, 94, 0.05)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#22c55e',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                },
                {
                    label: 'Saída',
                    data: mov.saida,
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.05)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#f97316',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                },
            ],
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: { size: 12, family: 'Inter' },
                        padding: 15,
                        usePointStyle: true,
                    },
                },
                tooltip: {
                    callbacks: {
                        footer: function () {
                            return mov.placeholder ? 'Sem movimentações no período' : '';
                        },
                    },
                },
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0, 0, 0, 0.05)' },
                    ticks: { font: { family: 'Inter' } },
                },
                x: {
                    grid: { display: false },
                    ticks: { font: { family: 'Inter' } },
                },
            },
        },
    });
})();
</script>
